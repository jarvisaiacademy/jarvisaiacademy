# Netlify Configuration for Jarvis AI Academy
#
# `$CONTEXT` reflects the *site's* production-branch setting, which lives in the Netlify UI
# (Site configuration → Build & deploy → Branches) and must name `production`. If that setting
# still names `main` (now deleted), every push — including a promotion — is a branch deploy,
# the rule below skips it, and the site silently stops updating.

[build]
  command = "npm run build"
  publish = ".next"
  # Build minutes are metered and task PRs land on `development`.
  # Exit 0 means "skip this build", so this builds only for the production context.
  # Trade-off: no branch or deploy-preview URLs — verify locally with `pnpm dev`.
  # Delete this line to get preview builds back.
  ignore = "test \"$CONTEXT\" != \"production\""

# Proxy the Firebase Auth handler so the OAuth popup can use the clean domain.
# Only reachable when NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN is the custom domain; with it set to
# `*.firebaseapp.com` the popup goes straight to Google and this rule never fires. Kept
# pointing at the live project regardless — it named the decommissioned `jarvisaiacademy-580a7`,
# which would have broken sign-in the moment anyone set the custom domain.
[[redirects]]
  from = "/__/auth/*"
  to = "https://jarvisaiacademy-a94b6.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true
